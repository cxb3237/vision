default_mode: track
camera_online_timeout_s: 1.0

ball_uart:
  enabled: true
  port: /dev/ttyAMA0
  baudrate: 9600
  timeout_s: 0.02
  write_timeout_s: 0.05
  reconnect_interval_s: 1.0
  # Maximum UART send rate; actual position updates are limited by valid vision frames.
  send_rate_hz: 50
  line_ending: "\r\n"
  wait_ready: true
  ping_interval_s: 1.0
  status_interval_s: 1.0
  link_timeout_s: 3.0
  debug_position_interval_s: 0.2
  statistics_interval_s: 1.0
  control_reconcile_interval_s: 0.5
  calibrated: false
  left_endpoint_px: 72
  right_endpoint_px: 568
  servo_side: right
